<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Shopping Cart</title>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script type="text/javascript" src="javascript/api.js" defer></script>
  <script type="text/javascript" src="javascript/shopping_cart.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><img src="images/pokeball-pokemon-svgrepo-com.svg" width="40" height="40" alt="PokeStore logo"></div>
    <div class="card-text">
        <img src="images/pokemon-trainer-pokemon-svgrepo-com.svg" width="20" alt="pokemon trainer">
      <p id="user-email"></p>
    </div>
    <div class="login">
      <button type="button" id="logout-btn">Logout</button>
    </div>
  </nav>
  <main>
    <h1>Your Shopping Cart</h1>
    <div class="shopping-cart">
      <div> Product Name </div>
      <div> Quantity </div>
      <div> Unit Price </div>
      <div> bird food </div>
      <div class="number"> 10 </div>
      <div class="number"> $6 </div>
    </div>
    <div class="profile-button-container">
      <a class="action-btn" href="products.html">Back to products</a>
      <button class="action-btn" type="button">Complete Purchase</button>
    </div>
  </main>
</body>
</html>
